name: Manage Weirdhost Accounts

on:
  schedule:
    # 每天早上 8 点执行
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      action:
        description: '操作类型'
        required: true
        default: 'status'
        type: choice
        options:
          - status
          - renew
          - list

jobs:
  manage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Check account status
        env:
          WEIRDHOST_ACCOUNTS: ${{ secrets.WEIRDHOST_ACCOUNTS }}
        run: |
          echo "Checking account status..."
          python scripts/check_accounts.py
