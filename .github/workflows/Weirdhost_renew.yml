name: Weirdhost 多账号自动续期

on:
  schedule:
    - cron: '20 4 * * *'
  workflow_dispatch:

jobs:
  add_time:
    name: 续期脚本
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write
      actions: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb \
            x11-utils \
            fonts-nanum \
            fonts-noto-cjk \
            xdotool \
            scrot \
            wget \
            jq \
            curl \
            unzip

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade seleniumbase aiohttp pynacl

      # 不使用 if: secrets.xxx
      # 直接启动，由脚本自己判断 PROXY_NODE 是否存在
      - name: 启动 sing-box
        env:
          PROXY_NODE: ${{ secrets.PROXY_NODE }}
        run: |
          if [ -z "$PROXY_NODE" ]; then
            echo "未设置 PROXY_NODE"
            echo "跳过 sing-box"
            exit 0
          fi

          chmod +x scripts/start_singbox.sh
          bash scripts/start_singbox.sh

          echo "等待 sing-box..."

          for i in $(seq 1 20); do
            if curl \
              --proxy socks5h://127.0.0.1:1080 \
              --max-time 5 \
              -s https://api.ipify.org >/tmp/proxy_ip 2>/dev/null
            then
              echo "代理启动成功"
              echo "出口 IP: $(cat /tmp/proxy_ip)"
              break
            fi

            echo "等待代理 $i/20"
            sleep 2
          done

      - name: 检查代理
        env:
          PROXY_NODE: ${{ secrets.PROXY_NODE }}
        run: |
          if [ -z "$PROXY_NODE" ]; then
            echo "未设置 PROXY_NODE，跳过代理检查"
            exit 0
          fi

          echo "检查 SOCKS5..."

          if curl \
            --proxy socks5h://127.0.0.1:1080 \
            --max-time 10 \
            https://api.ipify.org
          then
            echo
            echo "SOCKS5 代理正常"
          else
            echo
            echo "代理检查失败"
            echo "继续执行续期脚本"
          fi

      - name: 创建调试目录
        run: |
          mkdir -p debug
          mkdir -p screenshots
          mkdir -p logs

      - name: 运行 Weirdhost 续期
        env:
          WEIRDHOST_COOKIE_1: ${{ secrets.WEIRDHOST_COOKIE_1 }}
          WEIRDHOST_COOKIE_2: ${{ secrets.WEIRDHOST_COOKIE_2 }}
          WEIRDHOST_COOKIE_3: ${{ secrets.WEIRDHOST_COOKIE_3 }}
          WEIRDHOST_COOKIE_4: ${{ secrets.WEIRDHOST_COOKIE_4 }}
          WEIRDHOST_COOKIE_5: ${{ secrets.WEIRDHOST_COOKIE_5 }}

          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}

          REPO_TOKEN: ${{ secrets.REPO_TOKEN }}

          PROXY_NODE: ${{ secrets.PROXY_NODE }}
          CF_CLEARANCE: ${{ secrets.CF_CLEARANCE }}

          PROXY_URL: socks5://127.0.0.1:1080

          GITHUB_REPOSITORY: ${{ github.repository }}

          PYTHONUNBUFFERED: "1"

        run: |
          set +e

          echo "========================================"
          echo "开始 Weirdhost 自动续期"
          echo "========================================"

          if [ ! -f scripts/weirdhost_renew.py ]; then
            echo "ERROR: 找不到 scripts/weirdhost_renew.py"
            exit 1
          fi

          xvfb-run \
            --auto-servernum \
            --server-args="-screen 0 1920x1080x24" \
            python -u scripts/weirdhost_renew.py

          EXIT_CODE=$?

          echo
          echo "========================================"
          echo "续期脚本退出码: $EXIT_CODE"
          echo "========================================"

          echo "RENEW_EXIT_CODE=$EXIT_CODE" >> "$GITHUB_ENV"

      - name: 收集截图
        if: always()
        run: |
          mkdir -p artifact-screenshots

          find . \
            -type f \
            \( -name "*.png" -o -name "*.jpg" -o -name "*.jpeg" \) \
            -not -path "./.git/*" \
            -exec cp --parents {} artifact-screenshots/ \; \
            2>/dev/null || true

          find artifact-screenshots -type f 2>/dev/null || true

      - name: 上传调试截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: artifact-screenshots/
          if-no-files-found: ignore
          retention-days: 3

      - name: 收集 HTML
        if: always()
        run: |
          mkdir -p artifact-html

          find . \
            -type f \
            \( -name "*.html" -o -name "*.htm" \) \
            -not -path "./.git/*" \
            -exec cp --parents {} artifact-html/ \; \
            2>/dev/null || true

      - name: 上传调试 HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-html
          path: artifact-html/
          if-no-files-found: ignore
          retention-days: 3

      - name: 上传 sing-box 日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: singbox-log
          path: |
            /tmp/singbox.log
            logs/singbox.log
          if-no-files-found: ignore
          retention-days: 3

      - name: 最终检查
        if: always()
        run: |
          echo "========================================"
          echo "Weirdhost 续期运行结束"
          echo "========================================"

          echo "Python:"
          python --version

          echo
          echo "续期脚本退出码:"
          echo "${RENEW_EXIT_CODE:-unknown}"

          if [ "${RENEW_EXIT_CODE:-0}" != "0" ]; then
            exit "${RENEW_EXIT_CODE}"
          fi

      - name: 清理旧运行记录
        if: always()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          delete_workflow_pattern: ${{ github.workflow }}
          retain_days: 0
          keep_minimum_runs: 3
