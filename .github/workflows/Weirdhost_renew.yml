```yaml
name: Weirdhost 多账号自动续期

on:
  schedule:
    - cron: '20 4 * * *'
  workflow_dispatch:

jobs:
  add_time:
    name: 续期脚本
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write
      actions: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 设置 Python 环境
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: 检查运行环境
        run: |
          echo "========================================"
          echo "系统信息"
          echo "========================================"
          uname -a
          echo
          echo "Python:"
          python --version
          echo
          echo "Pip:"
          pip --version
          echo
          echo "========================================"

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb \
            x11-utils \
            fonts-nanum \
            fonts-noto-cjk \
            xdotool \
            scrot \
            wget \
            jq \
            curl \
            unzip

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade \
            seleniumbase \
            aiohttp \
            pynacl

      - name: 启动 sing-box 转发代理
        if: ${{ secrets.PROXY_NODE != '' }}
        env:
          PROXY_NODE: ${{ secrets.PROXY_NODE }}
        run: |
          chmod +x scripts/start_singbox.sh
          bash scripts/start_singbox.sh

          echo "等待 sing-box 启动..."
          for i in $(seq 1 20); do
            if curl -s --proxy socks5h://127.0.0.1:1080 \
              --max-time 5 \
              https://api.ipify.org >/tmp/proxy_ip 2>/dev/null; then

              echo "代理启动成功"
              echo "出口 IP: $(cat /tmp/proxy_ip)"
              break
            fi

            echo "等待代理... $i/20"
            sleep 2
          done

      - name: 检查代理
        if: ${{ secrets.PROXY_NODE != '' }}
        run: |
          echo "检查 SOCKS5 代理..."

          if curl \
            --proxy socks5h://127.0.0.1:1080 \
            --max-time 10 \
            https://api.ipify.org; then
            echo
            echo "SOCKS5 代理正常"
          else
            echo
            echo "WARNING: SOCKS5 代理检查失败"
            echo "继续运行续期脚本"
          fi

      - name: 创建调试目录
        run: |
          mkdir -p debug
          mkdir -p screenshots
          mkdir -p logs

      - name: 运行续期脚本
        env:
          WEIRDHOST_COOKIE_1: ${{ secrets.WEIRDHOST_COOKIE_1 }}
          WEIRDHOST_COOKIE_2: ${{ secrets.WEIRDHOST_COOKIE_2 }}
          WEIRDHOST_COOKIE_3: ${{ secrets.WEIRDHOST_COOKIE_3 }}
          WEIRDHOST_COOKIE_4: ${{ secrets.WEIRDHOST_COOKIE_4 }}
          WEIRDHOST_COOKIE_5: ${{ secrets.WEIRDHOST_COOKIE_5 }}

          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}

          REPO_TOKEN: ${{ secrets.REPO_TOKEN }}

          PROXY_NODE: ${{ secrets.PROXY_NODE }}
          CF_CLEARANCE: ${{ secrets.CF_CLEARANCE }}

          PROXY_URL: socks5://127.0.0.1:1080
          GITHUB_REPOSITORY: ${{ github.repository }}

          PYTHONUNBUFFERED: "1"

        run: |
          set +e

          echo "========================================"
          echo "开始 Weirdhost 自动续期"
          echo "========================================"

          if [ ! -f scripts/weirdhost_renew.py ]; then
            echo "ERROR: 找不到 scripts/weirdhost_renew.py"
            exit 1
          fi

          xvfb-run \
            --auto-servernum \
            --server-args="-screen 0 1920x1080x24" \
            python -u scripts/weirdhost_renew.py

          EXIT_CODE=$?

          echo
          echo "========================================"
          echo "续期脚本退出码: $EXIT_CODE"
          echo "========================================"

          echo "RENEW_EXIT_CODE=$EXIT_CODE" >> "$GITHUB_ENV"

          # 暂时不在这里退出
          # 让后面的调试 Artifact 一定能够上传

      - name: 收集调试文件
        if: always()
        run: |
          echo "收集调试文件..."

          mkdir -p artifact-debug

          # PNG
          find . -type f \
            \( -name "*.png" -o -name "*.jpg" -o -name "*.jpeg" \) \
            -not -path "./.git/*" \
            -exec cp --parents {} artifact-debug/ \; \
            2>/dev/null || true

          # HTML
          find . -type f \
            \( -name "*.html" -o -name "*.htm" \) \
            -not -path "./.git/*" \
            -exec cp --parents {} artifact-debug/ \; \
            2>/dev/null || true

          # 日志
          if [ -f /tmp/singbox.log ]; then
            cp /tmp/singbox.log artifact-debug/
          fi

          if [ -d logs ]; then
            cp -r logs artifact-debug/ 2>/dev/null || true
          fi

          echo "调试文件:"
          find artifact-debug -type f 2>/dev/null || true

      - name: 上传调试截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: |
            artifact-debug/**/*.png
            artifact-debug/**/*.jpg
            artifact-debug/**/*.jpeg
          if-no-files-found: ignore
          retention-days: 3
          compression-level: 6

      - name: 上传调试 HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-html
          path: |
            artifact-debug/**/*.html
            artifact-debug/**/*.htm
          if-no-files-found: ignore
          retention-days: 3
          compression-level: 6

      - name: 上传 sing-box 日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: singbox-log
          path: |
            /tmp/singbox.log
            artifact-debug/singbox.log
          if-no-files-found: ignore
          retention-days: 3
          compression-level: 6

      - name: 检查续期结果
        if: always()
        run: |
          echo "========================================"
          echo "最终运行结果"
          echo "========================================"

          echo "Python:"
          python --version

          echo
          echo "退出码:"
          echo "${RENEW_EXIT_CODE:-unknown}"

          echo
          echo "Artifacts 已进入上传阶段"

          echo "========================================"

          if [ "${RENEW_EXIT_CODE:-0}" != "0" ]; then
            exit "${RENEW_EXIT_CODE}"
          fi

      - name: 清理旧的工作流运行记录
        if: always()
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          delete_workflow_pattern: ${{ github.workflow }}
          retain_days: 0
          keep_minimum_runs: 3
```
