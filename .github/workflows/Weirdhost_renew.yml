name: Weirdhost 多账号自动续期

on:
  schedule:
    - cron: '20 4 * * *'
  workflow_dispatch:

jobs:
  add_time:
    name: 续期脚本
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb x11-utils fonts-nanum fonts-noto-cjk xdotool scrot wget jq

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install seleniumbase aiohttp pynacl

      # 如果 PROXY_NODE 配置了原生代理协议（hysteria2/vless/vmess/trojan/ss/tuic），
      # 用 sing-box 在本地转成 SOCKS5，再设置 PROXY_URL 给脚本用
      - name: 启动 sing-box 转发代理
        if: ${{ secrets.PROXY_NODE != '' }}
        env:
          PROXY_NODE: ${{ secrets.PROXY_NODE }}
        run: |
          set -e
          echo "=== 1. 下载 sing-box ==="
          SINGBOX_VERSION="1.13.16"
          wget -q "https://github.com/SagerNet/sing-box/releases/download/v${SINGBOX_VERSION}/sing-box-${SINGBOX_VERSION}-linux-amd64.tar.gz" -O /tmp/singbox.tgz
          tar xzf /tmp/singbox.tgz -C /tmp
          SINGBOX_BIN=$(find /tmp -name "sing-box" -type f | head -1)
          chmod +x "$SINGBOX_BIN"
          echo "✓ sing-box 已就绪: $("$SINGBOX_BIN" version | head -1)"

          echo "=== 2. 解析 PROXY_NODE 并生成配置 ==="
          PROTO=$(echo "$PROXY_NODE" | sed -E 's|^([a-z0-9]+)://.*|\1|')
          echo "  协议: $PROTO"

          mkdir -p /tmp/sing-box
          CONFIG_FILE="/tmp/sing-box/config.json"

          # 根据协议生成 sing-box outbound 配置
          case "$PROTO" in
            hysteria2|hy2)
              # hysteria2://auth@server:port?sni=xxx&insecure=0
              AUTH=$(echo "$PROXY_NODE" | sed -E 's|^[a-z0-9]+://([^@]+)@.*|\1|' | sed 's|%3A|:|g')
              HOST_PORT=$(echo "$PROXY_NODE" | sed -E 's|^[a-z0-9]+://[^@]+@([^/?]+).*|\1|')
              HOST=$(echo "$HOST_PORT" | cut -d: -f1)
              PORT=$(echo "$HOST_PORT" | cut -d: -f2)
              SNI=$(echo "$PROXY_NODE" | grep -oE 'sni=[^&]+' | cut -d= -f2 | head -1)
              [ -z "$SNI" ] && SNI="$HOST"
              INSECURE=$(echo "$PROXY_NODE" | grep -oE 'insecure=[0-9]' | cut -d= -f2 | head -1)
              [ -z "$INSECURE" ] && INSECURE=0
              cat > "$CONFIG_FILE" <<EOF
          {
            "log": {"level": "info"},
            "inbounds": [{
              "type": "socks",
              "tag": "socks-in",
              "listen": "127.0.0.1",
              "listen_port": 1080
            }, {
              "type": "mixed",
              "tag": "mixed-in",
              "listen": "127.0.0.1",
              "listen_port": 1081
            }],
            "outbounds": [{
              "type": "hysteria2",
              "tag": "proxy",
              "server": "$HOST",
              "server_port": $PORT,
              "password": "$AUTH",
              "tls": {
                "enabled": true,
                "server_name": "$SNI",
                "insecure": $( [ "$INSECURE" = "1" ] && echo true || echo false )
              }
            }]
          }
          EOF
              ;;
            *)
              echo "✗ 暂不支持的协议: $PROTO"
              echo "  支持的协议: hysteria2/hy2"
              exit 1
              ;;
          esac

          echo "  server: $HOST:$PORT"
          echo "✓ 配置已生成: $CONFIG_FILE"
          cat "$CONFIG_FILE" | jq .

          echo "=== 3. 启动 sing-box（后台） ==="
          nohup "$SINGBOX_BIN" run -c "$CONFIG_FILE" > /tmp/singbox.log 2>&1 &
          SINGBOX_PID=$!
          echo "✓ sing-box 已启动 (PID=$SINGBOX_PID)"
          sleep 3
          if kill -0 $SINGBOX_PID 2>/dev/null; then
            echo "✓ sing-box 进程存活"
          else
            echo "✗ sing-box 启动失败"
            cat /tmp/singbox.log
            exit 1
          fi

          echo "=== 4. 验证代理出网 ==="
          for i in 1 2 3 4 5; do
            if curl -s --socks5 127.0.0.1:1080 --max-time 10 "https://ipinfo.io/json" > /tmp/ipinfo.json; then
              cat /tmp/ipinfo.json | jq .
              echo "✓ 代理出网正常"
              break
            fi
            echo "  等待 sing-box 就绪... ($i/5)"
            sleep 2
          done

          # 写入环境变量给后续 step 用
          echo "PROXY_URL=socks5://127.0.0.1:1080" >> $GITHUB_ENV

      - name: 运行续期脚本
        env:
          WEIRDHOST_COOKIE_1: ${{ secrets.WEIRDHOST_COOKIE_1 }}
          WEIRDHOST_COOKIE_2: ${{ secrets.WEIRDHOST_COOKIE_2 }}
          WEIRDHOST_COOKIE_3: ${{ secrets.WEIRDHOST_COOKIE_3 }}
          WEIRDHOST_COOKIE_4: ${{ secrets.WEIRDHOST_COOKIE_4 }}
          WEIRDHOST_COOKIE_5: ${{ secrets.WEIRDHOST_COOKIE_5 }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
          # 优先用 PROXY_NODE 启动的本地 sing-box，否则用 PROXY_URL
          PROXY_URL: socks5://127.0.0.1:1080
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python scripts/weirdhost_renew.py

      - name: 上传调试截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: "*.png"
          retention-days: 3

      - name: 上传调试 HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-html
          path: "*.html"
          retention-days: 3

      - name: 上传 sing-box 日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: singbox-log
          path: /tmp/singbox.log
          retention-days: 3

      - name: 清理旧的工作流运行记录
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          delete_workflow_pattern: ${{ github.workflow }}
          retain_days: 0
          keep_minimum_runs: 3
