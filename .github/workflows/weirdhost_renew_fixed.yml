name: Weirdhost Auto Renew (Fixed)

on:
  schedule:
    # 每 3 天执行一次，在会话过期前保持活跃
    - cron: '0 0 */3 * *'
  workflow_dispatch:

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright selenium webdriver-manager
          playwright install chromium

      - name: Run Weirdhost renew script
        env:
          WEIRDHOST_COOKIE: ${{ secrets.WEIRDHOST_COOKIE }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "Starting Weirdhost auto renew..."
          python weirdhost_renew.py \
            --cookie "$WEIRDHOST_COOKIE" \
            --proxy "$PROXY_URL" \
            --telegram-bot "$TELEGRAM_BOT_TOKEN" \
            --telegram-chat "$TELEGRAM_CHAT_ID"

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-artifacts
          path: |
            *.png
            *.html
            logs/
