name: Weirdhost 自动续期 (API 版)

on:
  schedule:
    # 每 3 天执行一次，在会话过期前保持活跃
    - cron: '0 0 */3 * *'
  workflow_dispatch:

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      max-parallel: 1
      matrix:
        account: ${{ fromJson(secrets.WEIRDHOST_ACCOUNTS) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Renew Weirdhost session
        env:
          COOKIE: ${{ matrix.account.cookie }}
          URL: ${{ matrix.account.url || 'https://hub.weirdhost.xyz' }}
        run: |
          echo "========================================"
          echo "开始 Weirdhost 自动续期"
          echo "========================================"
          echo "处理账号: ${{ matrix.account.name }}"
          echo "========================================"
          
          # 使用纯 API 调用，不依赖浏览器
          response=$(curl -s -X POST \
            "${URL}/login/check" \
            -H "Cookie: ${COOKIE}" \
            -H "Content-Type: application/json" \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
            -d '{}')
          
          # 检查响应
          if echo "$response" | grep -q '"success"\|true\|200'; then
            echo "✅ 续期成功"
            exit 0
          else
            echo "⚠️  续期响应: $response"
            echo "❌ 续期失败"
            exit 1
          fi

      - name: Send Telegram notification on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{
              \"chat_id\": \"${TELEGRAM_CHAT_ID}\",
              \"text\": \"❌ Weirdhost 续期失败\\n\\n账号: ${{ matrix.account.name }}\\n时间: $(date '+%Y-%m-%d %H:%M:%S')\",
              \"parse_mode\": \"HTML\"
            }"
